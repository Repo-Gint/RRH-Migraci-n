<!-- sidenav.html -->
<div class="sidenav-container">
    <!-- Checkbox oculto que controla toda la magia -->
    <input type="checkbox" id="nav-toggle" class="nav-checkbox" [(checked)]="isMenuOpen" (change)="toggleMenu()" />

    <!-- Fondo oscuro difuminado que aparece al abrir el menú -->
    <div class="backdrop" (click)="toggleMenu()"></div>

    <!-- BOTÓN FLOTANTE: Es lo ÚNICO que se ve al inicio -->
    <label for="nav-toggle" class="menu-toggle-btn">
        <!-- Ícono Hamburguesa -->
        <svg class="hamburger-icon" viewBox="0 0 24 24">
            <path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"></path>
        </svg>
        <!-- Ícono Cerrar (X) -->
        <svg class="close-icon" viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"></path>
        </svg>
    </label>

    <!-- EL MENÚ LATERAL QUE SE DESLIZA -->
    <aside class="sidebar-panel">
        <nav class="custom-nav d-flex flex-column">
            
            <figure class="sidebar-brand-fig">
                <img class="codepen-logo" src="https://blog.codepen.io/wp-content/uploads/2023/09/logo-black.png" alt="Logo" />
                <figcaption>
                    <p class="user-id">Mantenimiento</p>
                    <p class="user-role">Panel G,I.</p>
                </figcaption>
            </figure>

            <div class="sidebar__wrapper">
                <div class="sidebar__item item--heading">Core</div>
                
                <a class="sidebar__link" routerLink="/inicio">
                    <i class="bi bi-house-door-fill icon"></i>
                    <span class="text">Inicio</span>
                </a>

                <div class="sidebar__item item--heading">Operación</div>
                
                <a class="sidebar__link collapsed" data-bs-toggle="collapse" data-bs-target="#collapseOrdenes">
                    <i class="bi bi-coin icon"></i>
                    <span class="text">Ordenes</span>
                    <i class="bi bi-caret-down ms-auto arrow"></i>
                </a>
                
                <div class="collapse dropdown-container" id="collapseOrdenes">
                    <nav class="nav flex-column">
                        <a class="sub-link" (click)="abrirModalRegistrarOrden()">Registrar Orden</a>
                        <a class="sub-link" routerLink="consulta-ordenes">Consultar Ordenes</a>
                    </nav>
                </div>

                <!-- SECCIÓN INFERIOR: Perfil y Logout -->
    <div class="sidebar__footer mt-auto pb-4">
        <div class="sidebar__item item--heading">General</div>
        
        <a class="sidebar__link" routerLink="/perfil">
            <span class="icon">
                <svg width="18" height="18" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                </svg>
            </span>
            <span class="text">Perfil</span>
        </a>

        <a class="sidebar__link" routerLink="/configuracion">
            <span class="icon">
                <svg width="18" height="18" fill="currentColor" class="bi bi-gear" viewBox="0 0 16 16">
                    <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0" />
                    <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z" />
                </svg>
            </span>
            <span class="text">Ajustes</span>
        </a>

        <!-- Botón de Cerrar Sesión con clase especial para animarlo en rojo -->
        <a class="sidebar__link link--logout" (click)="cerrarSesion()">
            <span class="icon">
                <svg width="18" height="18" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />
                    <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />
                </svg>
            </span>
            <span class="text">Cerrar Sesión</span>
        </a>
    </div>
            </div>
        </nav>
    </aside>
</div>
