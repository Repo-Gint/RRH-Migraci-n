<div class="pagetitle">
    <h1><i class="bi bi-globe-americas text-primary me-2"></i>Paises</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><i class="bi bi-house-door"></i> Inicio</li>
            <li class="breadcrumb-item">Paises</li>
            <li class="breadcrumb-item active">Consulta Paises</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <!-- Barra Superior de Filtros y Acciones -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-3">
            <div class="row align-items-center g-3">
                <!-- Buscador Global -->
                <div class="col-lg-7 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted ps-3">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="inputBusquedaGlobal" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Buscar por pais, abreviatura o color... [CTRL K]" [(ngModel)]="textoBusqueda" (input)="aplicarFiltros()">
                    </div>
                </div>

                <!-- Botón Switch Todos/Activos/Inactivos -->
                <div class="col-lg-5 col-md-6 d-flex justify-content-end align-items-center gap-3">
                    <div class="status-segment-switch d-inline-flex align-items-center bg-white border rounded-pill p-1 shadow-xs">
                        <i class="bi bi-funnel text-primary fs-5 ms-2 me-1"></i>
                        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 text-secondary font-medium transition-all" [class.active-pill]="filtroEstado === 'todos'" (click)="setFiltroEstado('todos')">
                            Todos
                        </button>
                        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 text-secondary font-medium transition-all" [class.active-pill]="filtroEstado === 'activos'" (click)="setFiltroEstado('activos')">
                            Activos
                        </button>
                        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 text-secondary font-medium transition-all" [class.active-pill]="filtroEstado === 'inactivos'" (click)="setFiltroEstado('inactivos')">
                            Inactivos
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla Principal -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0">
                    <thead class="table-light text-uppercase fs-7 text-muted">
                        <tr>
                            <!-- Agregamos iconos a los encabezados -->
                            <th class="text-start py-3 ps-4"><i class="bi bi-geo-alt-fill me-1 text-secondary"></i> País</th>
                            <th class="py-3"><i class="bi bi-flag-fill me-1 text-secondary"></i> Bandera</th>
                            <th class="py-3"><i class="bi bi-activity me-1 text-secondary"></i> Status</th>
                            <th class="py-3 text-end pe-4"><i class="bi bi-sliders me-1 text-secondary"></i> Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let paises of datosPaginados" class="row-hover-effect">
                            <td class="text-start ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-3 p-2 me-3 bg-light-primary text-primary border">
                                        <i class="bi bi-map fs-5"></i>
                                    </div>
                                    <div>
                                        <span class="fw-bold text-dark d-block">{{ paises.country }}</span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <!-- Se mantiene la imagen que ya funciona -->
                                <img [src]="paises.flag" [alt]="'Bandera de ' + paises.country" [title]="paises.country" class="border shadow-sm" style="width: 40px; height: auto; border-radius: 4px; object-fit: cover;">
                            </td>
                            <td>
                                <span class="badge px-3 py-2 rounded-pill fw-bold"
                                      [ngClass]="(paises.active == 1 || paises.active === true || paises.estado?.toLowerCase() === 'activo') 
                                        ? 'bg-success-subtle text-success border border-success-subtle' 
                                        : 'bg-danger-subtle text-danger border border-danger-subtle'">
                                    <!-- Se agrega un pequeño icono dinámico de check/x junto al status -->
                                    <i class="bi me-1" [ngClass]="(paises.active == 1 || paises.active === true || paises.estado?.toLowerCase() === 'activo') ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
                                    {{ paises.estado }}
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group gap-1">
                                    <button class="btn btn-sm btn-outline-primary border-0 bg-light-primary btn-action" title="Editar"
                                        (click)="abrirModalRegistrarPais(paises.id_country)">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <button *ngIf="!(paises.active == 1 || paises.active === true || paises.estado?.toLowerCase() === 'activo')" 
                                            class="btn btn-sm btn-outline-success border-0 bg-light-success btn-action" title="Activar"
                                        (click)="cambiarStatus(paises)">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                    <button *ngIf="paises.active == 1 || paises.active === true || paises.estado?.toLowerCase() === 'activo'" 
                                            class="btn btn-sm btn-outline-danger border-0 bg-light-danger btn-action" title="Desactivar"
                                        (click)="cambiarStatus(paises)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr *ngIf="datosPaginados.length === 0">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-3 text-secondary opacity-50"></i>
                                <h5 class="fw-normal">No se encontraron países</h5>
                                <p class="mb-0 fs-7">Intenta cambiar los filtros de búsqueda.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Paginación Footer Dinámica -->
        <div class="card-footer bg-white py-3 d-flex justify-content-between align-items-center border-0 pe-4 ps-4">
            <span class="text-muted fs-7"><i class="bi bi-list-ol me-1"></i> Mostrando <strong>{{ datosPaginados.length }}</strong> de <strong>{{ datosFiltrados.length }}</strong> registros en total</span>
            <nav *ngIf="totalPaginas > 1">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" [class.disabled]="paginaActual === 1">
                        <button class="page-link shadow-none" (click)="cambiarPagina(paginaActual - 1)"><i class="bi bi-chevron-left"></i> Anterior</button>
                    </li>
                    <li class="page-item" *ngFor="let p of paginas" [class.active]="p === paginaActual">
                        <button class="page-link shadow-none" (click)="cambiarPagina(p)">{{ p }}</button>
                    </li>
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
                        <button class="page-link shadow-none" (click)="cambiarPagina(paginaActual + 1)">Siguiente <i class="bi bi-chevron-right"></i></button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>
