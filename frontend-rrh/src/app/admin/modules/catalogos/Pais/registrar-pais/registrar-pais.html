<div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
    <!-- Encabezado con línea superior azul y botón de cierre -->
    <div class="modal-header border-0 pb-0 pt-4 px-4 position-relative">
        <div class="w-100">
            <div class="d-flex align-items-center justify-content-between">
                <h4 class="fw-bold text-dark mb-1 fs-5">
                    {{pkPaises == null ? 'Registrar' : 'Actualizar'}} País
                </h4>
                <button type="button" class="btn-close text-muted shadow-none" aria-label="Close" (click)="cerrarModal()"></button>
            </div>
            
            <nav class="d-flex align-items-center gap-2">
                <ol class="breadcrumb mb-0 fs-7">
                    <li class="breadcrumb-item text-muted">País</li>
                    <li class="breadcrumb-item active fw-medium text-secondary">
                        {{pkPaises == null ? 'Registrar' : 'Actualizar'}} País
                    </li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Cuerpo del Formulario -->
    <div class="modal-body p-4">
        <div class="card border border-light-subtle rounded-4 bg-light-subtle shadow-none">
            <div class="card-body p-4">
                <form [formGroup]="formPais" class="row g-4" autocomplete="off">
                    
                    <!-- Campo 1: Pais -->
                    <div class="col-lg-6">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="country" class="form-label fw-bold text-dark fs-7 mb-0">País:</label>
                            <span class="badge bg-primary-subtle text-primary fs-xxs fw-bold px-2 py-1 rounded">REQUERIDO</span>
                        </div>
                        <div class="input-group input-group-custom" [class.is-invalid-group]="campoEsInvalido('country')"
                             [class.is-valid-group]="campoEsValido('country')">
                            <span class="input-group-text bg-white border-end-0 text-muted ps-3">
                                <i class="bi bi-globe fs-6"></i>
                            </span>
                            <input id="country" type="text" class="form-control border-start-0 ps-2 shadow-none" placeholder="México" formControlName="country">
                            
                            <!-- Icono de Error -->
                            <span class="input-group-text bg-white border-start-0 pe-3" *ngIf="campoEsInvalido('country')">
                                <i class="bi bi-exclamation-circle-fill text-danger fs-6 animate-pulse"></i>
                            </span>

                            <!-- Icono de Éxito -->
                            <span class="input-group-text bg-white border-start-0 pe-3" *ngIf="campoEsValido('country')">
                                <i class="bi bi-check-circle-fill text-success fs-6 animate-check-pop"></i>
                            </span>
                        </div>
                        
                        <!-- Mensaje de error dinámico -->
                        <div *ngIf="campoEsInvalido('country')" class="text-danger fs-xxs mt-1 fw-semibold d-flex align-items-center gap-1 animate-fade-in">
                            <i class="bi bi-x-circle-fill"></i>
                            <span>{{ obtenerMensajeError('country') }}</span>
                        </div>
                        <small *ngIf="!campoEsInvalido('country')" class="text-muted d-block mt-1 fs-xxs">
                            Nombre oficial del país.
                        </small>
                    </div>

                    <!-- Campo 2: Abreviatura (Slug) -->
                    <div class="col-lg-6">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="slug" class="form-label fw-bold text-dark fs-7 mb-0">Abreviatura / Slug:</label>
                            <span class="text-muted fs-xxs fw-semibold">REQUERIDO</span>
                        </div>
                        <div class="input-group input-group-custom" [class.is-invalid-group]="campoEsInvalido('slug')"
                             [class.is-valid-group]="campoEsValido('slug')">
                            <span class="input-group-text bg-white border-end-0 text-muted ps-3">
                                <i class="bi bi-tag fs-6"></i>
                            </span>
                            <input id="slug" type="text" class="form-control border-start-0 ps-2 shadow-none fw-semibold" placeholder="mx" formControlName="slug">
                            
                            <!-- Icono de Error -->
                            <span class="input-group-text bg-white border-start-0 pe-3" *ngIf="campoEsInvalido('slug')">
                                <i class="bi bi-exclamation-circle-fill text-danger fs-6 animate-pulse"></i>
                            </span>

                            <!-- Icono de Éxito -->
                            <span class="input-group-text bg-white border-start-0 pe-3" *ngIf="campoEsValido('slug')">
                                <i class="bi bi-check-circle-fill text-success fs-6 animate-check-pop"></i>
                            </span>
                        </div>

                        <!-- Mensaje de error dinámico -->
                        <div *ngIf="campoEsInvalido('slug')" class="text-danger fs-xxs mt-1 fw-semibold d-flex align-items-center gap-1 animate-fade-in">
                            <i class="bi bi-x-circle-fill"></i>
                            <span>{{ obtenerMensajeError('slug') }}</span>
                        </div>
                    </div>

                    <!-- Campo 3: Bandera (Archivo) -->
                    <div class="col-lg-12 mt-3">
                        <label class="form-label fw-bold text-dark fs-7">Bandera del País:</label>

                        <div class="mb-2">
                            <button type="button" class="btn btn-sm btn-primary" (click)="fileInput.click()">
                                <i class="bi bi-upload me-1"></i> Seleccionar Bandera
                            </button>

                            <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" hidden>
                        </div>

                        <!-- Previsualización de la Bandera -->
                        <div class="d-flex flex-wrap gap-3 mt-2" *ngIf="flagPreview || currentFlagUrl">
                            <div class="position-relative">
                                <img [src]="flagPreview || currentFlagUrl" width="120" height="80" class="rounded border shadow-sm" style="object-fit: cover;">
                                <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1"
                                    (click)="eliminarBandera()" style="padding: 2px 6px;">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Mensaje de error de bandera -->
                        <div *ngIf="campoEsInvalido('flag')" class="text-danger fs-xxs mt-1 fw-semibold">
                            <span>{{ obtenerMensajeError('flag') }}</span>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Pie del Modal -->
    <div class="modal-footer border-top-0 pt-0 pb-4 px-4 d-flex justify-content-end gap-2">
        <button class="btn btn-animated btn-cancel rounded-pill px-4 py-2 text-secondary fw-semibold d-inline-flex align-items-center gap-2" 
                (click)="cerrarModal()">
            <i class="bi bi-x-circle fs-6"></i>
            <span>{{cambiosForm || pkPaises != null ? 'Cancelar' : 'Cerrar'}}</span>
        </button>

        <button *ngIf="pkPaises == null" class="btn btn-animated btn-primary-custom rounded-pill px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm" (click)="registrarPais()">
            <i class="bi bi-check-circle-fill fs-6"></i>
            <span>Registrar</span>
        </button> 

        <button *ngIf="pkPaises != null" class="btn btn-animated btn-warning-custom rounded-pill px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm" 
                (click)="actualizarPais()">
            <i class="bi bi-arrow-repeat fs-6"></i>
            <span>Actualizar</span>
        </button>
    </div>
</div>
